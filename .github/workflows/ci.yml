name: TAP validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TAP_APP_MODE: demo
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: isolated-ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Brand initial browser tab
        run: python scripts/brand_streamlit_shell.py
      - name: Validate question bank and source files
        run: python scripts/validate_project.py
      - name: Verify accounts against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:isolated-ci-test-password@localhost:5432/postgres
        run: python scripts/check_postgres_accounts.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test all Streamlit pages and role navigation
        run: python scripts/smoke_pages.py
      - name: Compile Python sources
        run: python -m compileall -q .
