[theme]
# Console v2: one KMA blue key colour on greys (membership site tone).
base = "light"
baseFontSize = 16
primaryColor = "#1769FF"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F3F5"
textColor = "#161614"
borderColor = "#E5E7EB"
dataframeBorderColor = "#E5E7EB"
dataframeHeaderBackgroundColor = "#F7F8F9"
buttonRadius = "full"
baseRadius = "large"
# Keep the default face here: st.dataframe draws on a canvas, and the
# unicode-range subsets of Pretendard leave Korean glyphs half drawn there.
# DOM text switches to Pretendard in assets/console-v2.css.
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = false
toolbarMode = "minimal"
